# JESA Digital Twin — Infrastructure Stack
#
# Services in this file:
#   - mosquitto   : MQTT broker (UNS backbone)
#   - nodered     : Derived data + ISA-18.2 Alarm Engine + Monitor
#                   (OPC UA Gateway tab is DISABLED — Python uns/gateway.py
#                    is the sole OPC UA -> MQTT bridge, launched locally)
#   - influxdb    : Time-series database
#   - telegraf    : MQTT -> InfluxDB writer
#   - grafana     : Dashboards
#   - ml-inference: OPTIONAL — ML inference container.
#                   By default the launcher runs ML inference locally
#                   (uns/ml_inference_service.py) for model hot-reload.
#                   Only start this container if you want Docker-hosted ML.
#
# OPC UA simulators (A1/A2/A3/PLC), the UNS gateway (Python), and the ML
# inference service run on the HOST via launch_all.{bat,ps1}.
#
# Usage:
#   docker compose up -d mosquitto nodered influxdb telegraf grafana
#   docker compose logs -f nodered      # follow Node-RED logs
#   docker compose down                 # stop all containers

services:

  # ── MQTT Broker ─────────────────────────────────────────────────────────
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: jesa-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"    # MQTT
      - "9001:9001"    # WebSocket (Paho.JS browser viewer)
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -W 3 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ── Node-RED (Derived Data + Alarms + Monitor) ───────────────────────────
  # Tabs active: Derived Data · Alarm Engine · Monitor Dashboard
  # OPC UA Gateway tab (tab-gw) is DISABLED in infra/nodered/flows.json.
  # Python uns/gateway.py (host process) is the sole OPC UA -> MQTT bridge.
  # NOTE: --jitless disables V8 JIT to work around WSL2 kernel TurboFan crash.
  nodered:
    build:
      context: .
      dockerfile: Dockerfile.nodered
    image: jesa-nodered:latest
    container_name: jesa-nodered
    restart: unless-stopped
    ports:
      - "1880:1880"    # Node-RED editor + /ui dashboard
    depends_on:
      mosquitto:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: Africa/Casablanca
    volumes:
      - ./infra/nodered/flows.json:/data/flows.json
      - ./infra/nodered/settings.js:/data/settings.js:ro
    # Entrypoint wrapper: symlinks pre-built node_modules into /data, then
    # launches Node-RED via "node --jitless ..." (bypasses WSL2 V8 JIT crash
    # and Node 18 webcrypto EvalError).
    working_dir: /usr/src/node-red
    entrypoint: ["/usr/local/bin/entrypoint-nodered.sh"]
    command: ["node", "--jitless", "--max-old-space-size=512", "node_modules/node-red/red.js", "--userDir", "/data", "flows.json"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:1880/settings || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s



  # ── Time-Series Database ─────────────────────────────────────────────────
  influxdb:
    image: influxdb:2
    container_name: jesa-influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: jesa
      DOCKER_INFLUXDB_INIT_PASSWORD: jesa-dev-2026
      DOCKER_INFLUXDB_INIT_ORG: jesa
      DOCKER_INFLUXDB_INIT_BUCKET: telemetry
      DOCKER_INFLUXDB_INIT_RETENTION: 30d
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: jesa-dev-token
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Telegraf: MQTT → InfluxDB ────────────────────────────────────────────
  telegraf:
    image: telegraf:1.34
    container_name: jesa-telegraf
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    environment:
      INFLUXDB_TOKEN: jesa-dev-token
    volumes:
      - ./infra/telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro

  # ── ML Inference Service (OPTIONAL — runs locally by default) ─────────────
  # Subscribes to MQTT topics published by Python uns/gateway.py.
  # The launcher starts this service LOCALLY (uns/ml_inference_service.py)
  # for model hot-reload. Start this container only if you want Docker-hosted ML.
  # Code is COPY'd into the image (not volume-mounted) to avoid WSL2 .pyc corruption.
  ml-inference:
    build:
      context: .
      dockerfile: Dockerfile.ml
    image: jesa-ml-inference:latest
    container_name: jesa-ml-inference
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_healthy
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MODEL_DIR: /app/notebooks/models
      MQTT_CLIENT_ID: ml-inference-docker
    healthcheck:
      test: ["CMD", "python", "-c", "import pandas, sklearn; print('ok')"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
    volumes:
      - ./notebooks/models:/app/notebooks/models

  # ── Grafana ──────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.1.5
    container_name: jesa-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=jesa-admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    depends_on:
      influxdb:
        condition: service_healthy
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  mosquitto-data:
  mosquitto-log:
  influxdb-data:
  influxdb-config:
  grafana-data:
