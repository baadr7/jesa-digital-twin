# Telegraf configuration for the JESA UNS
# Reference: docs/uns-spec.md §7
#
# Pipeline: MQTT consumer → InfluxDB v2 writer
#   Subscribes to jesa/site1/# and parses JSON payloads.
#   Derives InfluxDB measurement, tags, and fields from the MQTT topic.

# ── Global agent settings ────────────────────────────────────────────────
[agent]
  interval = "1s"
  flush_interval = "5s"
  hostname = "jesa-telegraf"
  omit_hostname = false

# ── Input: MQTT consumer ────────────────────────────────────────────────
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics  = ["jesa/site1/#"]

  # Persistent session so we don't lose messages during restart
  client_id = "jesa-telegraf"
  persistent_session = true
  qos = 0

  # JSON payload parsing
  data_format = "json"
  json_time_key = "ts"
  json_time_format = "2006-01-02T15:04:05.000Z07:00"
  json_string_fields = ["q"]

  # Derive InfluxDB tags from the MQTT topic structure:
  #   jesa/site1/{area_1}/{area_2}/{asset_id}/{folder}/{tag_name}
  #   OR for PLC:
  #   jesa/site1/plc/{folder}/{tag_name}
  #
  # We use the topic as the measurement name and extract via tag_keys.
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "jesa/site1/+/+/+/+/+"
    tags  = "_/_/area_1/area_2/asset_id/folder/_"
    measurement = "_/_/_/_/asset_id/_/_"
    fields = "_/_/_/_/_/_/tag_name"

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "jesa/site1/+/+/+"
    tags  = "_/_/area_1/folder/_"
    measurement = "_/_/asset_id/_/_"
    fields = "_/_/_/_/tag_name"

# ── Output: InfluxDB v2 ────────────────────────────────────────────────
[[outputs.influxdb_v2]]
  urls         = ["http://influxdb:8086"]
  token        = "${INFLUXDB_TOKEN}"
  organization = "jesa"
  bucket       = "telemetry"

  # Batch settings for throughput
  metric_batch_size = 500
  metric_buffer_limit = 10000
