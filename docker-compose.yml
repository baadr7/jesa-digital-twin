# JESA Digital Twin — Full Infrastructure Stack
#
# All services in one docker-compose.
# OPC UA simulators (A1/A2/A3/PLC) run on the HOST via launch_all.ps1
# and are reached by Node-RED via host.docker.internal:4840-4843.
#
# Usage:
#   docker compose build nodered        # rebuild Node-RED image
#   docker compose up -d                # start everything
#   docker compose logs -f nodered      # follow Node-RED logs
#   docker compose down                 # stop all containers

services:

  # ── MQTT Broker ─────────────────────────────────────────────────────────
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: jesa-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"    # MQTT
      - "9001:9001"    # WebSocket (Paho.JS browser viewer)
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -W 3 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ── Node-RED UNS Gateway ─────────────────────────────────────────────────
  # Tabs: OPC UA Gateway · Derived Data · Alarm Engine · Monitor Dashboard
  # Connects to OPC UA sims on host via host.docker.internal:4840–4843.
  # NOTE: --jitless disables V8 JIT to work around WSL2 kernel TurboFan crash.
  nodered:
    build:
      context: .
      dockerfile: Dockerfile.nodered
    image: jesa-nodered:latest
    container_name: jesa-nodered
    restart: unless-stopped
    ports:
      - "1880:1880"    # Node-RED editor + /ui dashboard
    depends_on:
      mosquitto:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: Africa/Casablanca
    volumes:
      - ./infra/nodered/flows.json:/data/flows.json
      - ./infra/nodered/settings.js:/data/settings.js:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:1880/settings || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s



  # ── Time-Series Database ─────────────────────────────────────────────────
  influxdb:
    image: influxdb:2
    container_name: jesa-influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: jesa
      DOCKER_INFLUXDB_INIT_PASSWORD: jesa-dev-2026
      DOCKER_INFLUXDB_INIT_ORG: jesa
      DOCKER_INFLUXDB_INIT_BUCKET: telemetry
      DOCKER_INFLUXDB_INIT_RETENTION: 30d
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: jesa-dev-token
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Telegraf: MQTT → InfluxDB ────────────────────────────────────────────
  telegraf:
    image: telegraf:1.34
    container_name: jesa-telegraf
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    environment:
      INFLUXDB_TOKEN: jesa-dev-token
    volumes:
      - ./infra/telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro

  # ── ML Inference Service ─────────────────────────────────────────────────
  # Subscribes to MQTT topics published by Node-RED.
  # Code is COPY'd into the image (not volume-mounted) to avoid WSL2 .pyc corruption.
  ml-inference:
    build:
      context: .
      dockerfile: Dockerfile.ml
    image: jesa-ml-inference:latest
    container_name: jesa-ml-inference
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_healthy
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MODEL_DIR: /app/notebooks/models
      MQTT_CLIENT_ID: ml-inference-docker
    healthcheck:
      test: ["CMD", "python", "-c", "import pandas, sklearn; print('ok')"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
    volumes:
      - ./notebooks/models:/app/notebooks/models

  # ── Grafana ──────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.1.5
    container_name: jesa-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=jesa-admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    depends_on:
      influxdb:
        condition: service_healthy
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  mosquitto-data:
  mosquitto-log:
  influxdb-data:
  influxdb-config:
  grafana-data:
