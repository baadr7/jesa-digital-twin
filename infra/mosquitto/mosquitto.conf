# Eclipse Mosquitto configuration for the JESA UNS
# Reference: docs/uns-spec.md §2
#
# Listeners:
#   1883  — standard MQTT (gateway, Telegraf, ML services)
#   9001  — WebSocket (Three.js viewer, Grafana live)
#
# Security: anonymous access enabled for development.
# Production: replace with password_file or TLS client certificates.

# ── General ──────────────────────────────────────────────────────────────
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type warning
log_type error
log_type notice
connection_messages true

# ── TCP listener (MQTT) ─────────────────────────────────────────────────
listener 1883
protocol mqtt
allow_anonymous true

# ── WebSocket listener ──────────────────────────────────────────────────
listener 9001
protocol websockets
allow_anonymous true
